<title>Tile Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: instruction-booklet feel. Cool blue-grey paper, white stage, yellow "add these" callouts, chunky rounded display type. */
:root {
  --bg: #eaf0f5;
  --surface: #ffffff;
  --stage: #f8fafc;
  --stage-dot: #d8e1ea;
  --ink: #18212d;
  --muted: #5a6778;
  --line: #d3dce6;
  --accent: #f0592a;
  --accent-ink: #ffffff;
  --callout: #fff3c4;
  --callout-line: #f1cf55;
  --new-stroke: #18212d;
  --ground: #c9d5e1;
  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151c; --surface: #19202a; --stage: #141a22; --stage-dot: #232c38;
    --ink: #edf2f7; --muted: #9ba8b8; --line: #2a3442; --accent: #ff7247; --accent-ink: #1a0d07;
    --callout: #2b2614; --callout-line: #6b5a1c; --new-stroke: #ffffff; --ground: #263140;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151c; --surface: #19202a; --stage: #141a22; --stage-dot: #232c38;
  --ink: #edf2f7; --muted: #9ba8b8; --line: #2a3442; --accent: #ff7247; --accent-ink: #1a0d07;
  --callout: #2b2614; --callout-line: #6b5a1c; --new-stroke: #ffffff; --ground: #263140;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; }
button, a { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .2px; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand span { white-space: nowrap; }
.topbar .crumb { color: var(--muted); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .spacer { flex: 1; }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; min-width: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; font-weight: 700; }
.iconbtn:hover { border-color: var(--muted); }
.iconbtn svg { width: 18px; height: 18px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 0; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-weight: 600; font-size: 18px; text-decoration: none; }
.btn:hover { filter: brightness(1.05); }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
.btn[disabled] { opacity: .35; cursor: default; }

/* Catalog */
.hero { padding-block: 28px 8px; display: grid; gap: 10px; }
.hero h1 { font-size: clamp(30px, 5vw, 46px); font-weight: 700; }
.hero p { margin: 0; color: var(--muted); max-width: 60ch; font-size: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 16px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; padding-bottom: 28px; }
.card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; text-decoration: none; transition: transform .15s ease, box-shadow .15s ease; }
a.card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(20, 40, 70, .12); }
.card .thumb { aspect-ratio: 4 / 3; max-width: 100%; background: var(--stage); background-image: radial-gradient(var(--stage-dot) 1px, transparent 1.2px); background-size: 16px 16px; display: grid; place-items: center; }
.card .thumb svg { width: 100%; height: 100%; }
.card .body { padding: 12px 14px 14px; display: grid; gap: 6px; }
.card h3 { font-size: 20px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--muted); font-size: 13px; font-weight: 600; }
.tag { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.searchrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-top: 12px; }
.search { flex: 1 1 260px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 0 16px; min-height: 48px; }
.search:focus-within { border-color: var(--accent); }
.search svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; font-size: 16px; }
.btn.small { min-height: 48px; font-size: 16px; padding: 0 18px; }
.chip .count { font-weight: 600; opacity: .6; font-variant-numeric: tabular-nums; margin-left: 2px; }
.filterbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-bottom: 14px; }
.filterbar .spacer { flex: 1; }
.resultcount { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.sel { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
.sel select { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
.more { display: flex; justify-content: center; padding-bottom: 40px; }
.empty { grid-column: 1 / -1; text-align: center; padding: 40px 16px; color: var(--muted); }
.empty h3 { color: var(--ink); margin-bottom: 6px; }
.onstep { color: var(--accent); }
.related { padding-bottom: 40px; display: grid; gap: 14px; }
.related .grid { padding-bottom: 0; }
@media (max-width: 520px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .card h3 { font-size: 16px; } .card .body { padding: 10px; } .card .meta span:nth-child(2) { display: none; } }
.soon-row { display: grid; gap: 10px; padding-bottom: 40px; }
.soon-list { display: flex; flex-wrap: wrap; gap: 8px; }
.soon-item { border: 1px dashed var(--line); border-radius: 999px; padding: 6px 14px; color: var(--muted); font-weight: 700; font-size: 14px; }
.dots { letter-spacing: 2px; color: var(--accent); }
.dots i { font-style: normal; color: var(--line); }

/* Model overview */
.overview { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 24px; padding-block: 20px 40px; align-items: start; }
.overview .info { display: grid; gap: 16px; }
.overview h1 { font-size: clamp(30px, 4.4vw, 44px); font-weight: 700; }
.overview .lede { margin: 0; color: var(--muted); font-size: 16px; max-width: 60ch; }
.stats { display: flex; flex-wrap: wrap; gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; display: grid; }
.stat b { font-family: var(--font-display); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.section-title { font-family: var(--font-display); font-size: 20px; font-weight: 600; }
.bom { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.part { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.part svg { width: 40px; height: 40px; flex: none; }
.part .n { font-family: var(--font-display); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; }
.part .l { font-size: 13px; color: var(--muted); line-height: 1.25; font-weight: 600; }

/* Viewer */
.viewer { position: relative; background: var(--stage); background-image: radial-gradient(var(--stage-dot) 1px, transparent 1.2px); background-size: 18px 18px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.viewer .stage { width: 100%; height: 100%; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; }
.viewer .stage:active { cursor: grabbing; }
.viewer .stage svg { width: 100%; height: 100%; display: block; }
.viewer .tools { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
.viewer .tools .iconbtn { height: 36px; min-width: 36px; padding: 0 10px; font-size: 13px; }
.viewer .hint { position: absolute; left: 12px; bottom: 12px; font-size: 12px; color: var(--muted); font-weight: 600; pointer-events: none; }
.overview .viewer { aspect-ratio: 1 / 1; max-width: 100%; }

/* Polygons */
.tile { stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.tile.old { stroke-opacity: .55; }
.tile.nw { stroke: var(--new-stroke); stroke-width: 2.6; }
.rim { fill: none; stroke: #ffffff; stroke-opacity: .55; stroke-width: 1; vector-effect: non-scaling-stroke; }
.rim.old { stroke-opacity: .25; }
.groundpoly { fill: var(--ground); opacity: .55; }

/* Step page */
.steplayout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding-block: 16px 24px; }
.steplayout .viewer { height: calc(100vh - 56px - 32px - 60px); height: calc(100dvh - 56px - 32px - 60px); min-height: 380px; }
.panel { display: flex; flex-direction: column; gap: 14px; }
.stepnum { display: flex; align-items: baseline; gap: 10px; }
.stepnum b { font-family: var(--font-display); font-size: 64px; font-weight: 700; line-height: .9; font-variant-numeric: tabular-nums; }
.stepnum span { color: var(--muted); font-weight: 700; }
.stepnum-overlay { position: absolute; left: 14px; top: 8px; font-family: var(--font-display); font-weight: 700; font-size: 52px; line-height: 1; pointer-events: none; }
.callout { background: var(--callout); border: 2px solid var(--callout-line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 10px; }
.callout .tag { color: var(--ink); opacity: .7; }
.callout .parts { display: flex; flex-wrap: wrap; gap: 12px 18px; }
.callout .p { display: flex; align-items: center; gap: 6px; }
.callout .p svg { width: 44px; height: 44px; }
.callout .p b { font-family: var(--font-display); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.callout .p small { display: block; font-size: 12px; color: var(--muted); font-weight: 700; line-height: 1.2; }
.tip { margin: 0; font-size: 16px; }
.steptitle { font-size: 22px; }
.progress { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s ease; }
.progress-label { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stepnav { display: flex; gap: 10px; margin-top: auto; }
.stepnav .btn { flex: 1; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: var(--muted); }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
.kbd { font-size: 12px; color: var(--muted); }

/* Done */
.done { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; padding-block: 24px 40px; align-items: center; }
.done .viewer { aspect-ratio: 1 / 1; max-width: 100%; }
.done h1 { font-size: clamp(34px, 5vw, 54px); font-weight: 700; }
.done .info { display: grid; gap: 16px; }

@media (max-width: 860px) {
  .overview, .done { grid-template-columns: minmax(0, 1fr); }
  .steplayout { grid-template-columns: minmax(0, 1fr); padding-bottom: 96px; }
  .steplayout .viewer { height: auto; aspect-ratio: 1 / 1; max-height: 56vh; min-height: 0; width: 100%; }
  .stepnum b { font-size: 48px; }
  .stepnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; margin: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .kbd { display: none; }
}
@media (max-width: 520px) {
  body.inmodel .brand span { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#catalog" aria-label="Tile Builder home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 26 L16 4 L28 26 Z" fill="#f5c518" fill-opacity=".85" stroke="#b78e00" stroke-width="2" stroke-linejoin="round"/><rect x="11" y="15" width="14" height="14" rx="1.5" fill="#2f7de1" fill-opacity=".8" stroke="#1d4f90" stroke-width="2"/></svg>
      <span>Tile Builder</span>

<script>
"use strict";
/* ------------------------------------------------------------------
   Tile palette and part types
------------------------------------------------------------------ */
const COLORS = {
  red:    { hex: "#e5483f", name: "Red",    a: .8 },
  orange: { hex: "#f28a24", name: "Orange", a: .8 },
  yellow: { hex: "#f5c518", name: "Yellow", a: .82 },
  green:  { hex: "#36b357", name: "Green",  a: .8 },
  teal:   { hex: "#18aeb0", name: "Teal",   a: .8 },
  blue:   { hex: "#2f7de1", name: "Blue",   a: .78 },
  purple: { hex: "#8a5cd6", name: "Purple", a: .8 },
  pink:   { hex: "#ef6fa6", name: "Pink",   a: .8 },
  clear:  { hex: "#bfe2f4", name: "Clear",  a: .42 },
  white:  { hex: "#f4f2ee", name: "White",  a: .92 },
  brown:  { hex: "#9a6233", name: "Brown",  a: .85 },
  gray:   { hex: "#9aa3ad", name: "Gray",   a: .85 },
  black:  { hex: "#3a3f4a", name: "Black",  a: .95 },
};
const KINDS = {
  sq:    { name: "Square",          plural: "Squares" },
  rect:  { name: "Rectangle",       plural: "Rectangles" },
  tri:   { name: "Triangle",        plural: "Triangles" },
  rtri:  { name: "Right triangle",  plural: "Right triangles" },
  tall:  { name: "Tall triangle",   plural: "Tall triangles" },
  wheel: { name: "Wheel base",      plural: "Wheel bases" },
};
const KIND_ORDER = ["wheel", "sq", "rect", "tri", "rtri", "tall"];

/* ------------------------------------------------------------------
   3D geometry helpers. Units: 1 = one square tile edge. z is up.
   Front of every model faces -y.
------------------------------------------------------------------ */
const TALL_H = 1.8;     // height of the tall isosceles triangle
const EQ_H = Math.sqrt(3) / 2;
const WB = 0.3;         // wheel base height
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const len = (a) => Math.hypot(a[0], a[1], a[2]);
const norm = (a) => mul(a, 1 / len(a));
const mid = (a, b) => mul(add(a, b), 0.5);

const T = (k, c, p) => ({ k, c, p });
const quad = (o, u, v, c, k = "sq") => T(k, c, [o, add(o, u), add(add(o, u), v), add(o, v)]);
const flat = (x, y, z, c) => quad([x, y, z], [1, 0, 0], [0, 1, 0], c);
const flatRect = (x, y, z, c, dx = 1, dy = 0.5) => quad([x, y, z], [dx, 0, 0], [0, dy, 0], c, "rect");
const wx = (x, y, z, c, h = 1) => quad([x, y, z], [1, 0, 0], [0, 0, h], c, h === 1 ? "sq" : "rect");
const wy = (x, y, z, c, h = 1) => quad([x, y, z], [0, 1, 0], [0, 0, h], c, h === 1 ? "sq" : "rect");
// four walls of a 1x1 tube: front, right, back, left
function ring(x, y, z, c, h = 1) {
  const cs = Array.isArray(c) ? c : [c, c, c, c];
  return [wx(x, y, z, cs[0], h), wy(x + 1, y, z, cs[1], h), wx(x, y + 1, z, cs[2], h), wy(x, y, z, cs[3], h)];
}
// six walls of a 2x1 box
function ring2(x, y, z, c) {
  const cs = Array.isArray(c) ? c : [c, c, c, c, c, c];
  return [wx(x, y, z, cs[0]), wx(x + 1, y, z, cs[1]), wy(x + 2, y, z, cs[2]), wx(x + 1, y + 1, z, cs[3]), wx(x, y + 1, z, cs[4]), wy(x, y, z, cs[5])];
}
const onEdge = (a, b, dir, h, c, k) => T(k, c, [a, b, add(mid(a, b), mul(norm(dir), h))]);
const eqOn = (a, b, dir, c) => onEdge(a, b, dir, EQ_H, c, "tri");
const tallOn = (a, b, dir, c) => onEdge(a, b, dir, TALL_H, c, "tall");
const hinge = (a, b, dir, c) => { const d = norm(dir); return T("sq", c, [a, b, add(b, d), add(a, d)]); };
function pyramid(x, y, z, c) {
  const ap = [x + 0.5, y + 0.5, z + Math.SQRT1_2];
  const q = [[x, y, z], [x + 1, y, z], [x + 1, y + 1, z], [x, y + 1, z]];
  return q.map((p, i) => T("tri", c, [p, q[(i + 1) % 4], ap]));
}
const wheelBase = (x, y) => T("wheel", "black", [[x, y, WB], [x + 1, y, WB], [x + 1, y + 1, WB], [x, y + 1, WB]]);
const range = (a, b) => Array.from({ length: b - a }, (_, i) => a + i);

/* ------------------------------------------------------------------
   Parts counting
------------------------------------------------------------------ */
function countParts(tiles) {
  const map = new Map();
  for (const t of tiles) {
    const key = t.k + "|" + t.c;
    map.set(key, (map.get(key) || 0) + 1);
  }
  return [...map.entries()].map(([key, n]) => { const [k, c] = key.split("|"); return { k, c, n }; })
    .sort((a, b) => KIND_ORDER.indexOf(a.k) - KIND_ORDER.indexOf(b.k) || Object.keys(COLORS).indexOf(a.c) - Object.keys(COLORS).indexOf(b.c));
}
const allTiles = (m) => m.steps.flatMap((s) => s.tiles);
const partLabel = (p) => `${COLORS[p.c].name} ${(p.n === 1 ? KINDS[p.k].name : KINDS[p.k].plural).toLowerCase()}`;

/* ------------------------------------------------------------------
   Colors
------------------------------------------------------------------ */
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgb(c) { return `rgb(${c.map((v) => Math.round(Math.max(0, Math.min(255, v)))).join(",")})`; }
function shade(hex, k) { // k in [-1,1]
  const c = hexToRgb(hex);
  return rgb(k >= 0 ? c.map((v) => v + (255 - v) * k) : c.map((v) => v * (1 + k)));
}
function frameColor(c) { return c === "clear" ? "#6fa3c2" : c === "white" ? "#a9a49a" : shade(COLORS[c].hex, -0.38); }
function mix(hexA, hexB, t) { const a = /^#/.test(hexA) ? hexToRgb(hexA) : hexA.match(/\d+/g).map(Number), b = hexToRgb(hexB); return rgb(a.map((v, i) => v + (b[i] - v) * t)); }

/* ------------------------------------------------------------------
   Part icons (flat 2D, for parts lists)
------------------------------------------------------------------ */
function partIcon(k, c) {
  const col = COLORS[c], fill = col.hex, stroke = frameColor(c), op = Math.max(col.a, .6);
  const shapes = {
    sq: "M8 8H40V40H8Z",
    rect: "M6 16H42V32H6Z",
    tri: "M24 7L43 40H5Z",
    rtri: "M8 8L40 40H8Z",
    tall: "M24 3L36 45H12Z",

// Mount Fuji: a big square pyramid made of equilateral triangles (3 rows per side)
(() => {
  const S = 3, apex = [1.5, 1.5, S * Math.SQRT1_2];
  const faces = [
    { p0: [0, 0, 0], u: [1, 0, 0] }, { p0: [3, 0, 0], u: [0, 1, 0] },
    { p0: [3, 3, 0], u: [-1, 0, 0] }, { p0: [0, 3, 0], u: [0, -1, 0] },
  ].map((f) => ({ ...f, v: norm(sub(apex, add(f.p0, mul(f.u, 1.5)))) }));
  const L = (f, r, k) => add(f.p0, add(mul(f.u, k + r * 0.5), mul(f.v, r * EQ_H)));
  const up = (r, c) => faces.flatMap((f) => range(0, S - r).map((k) => T("tri", c, [L(f, r, k), L(f, r, k + 1), L(f, r + 1, k)])));
  const down = (r, c) => faces.flatMap((f) => range(0, S - r - 1).map((k) => T("tri", c, [L(f, r, k + 1), L(f, r + 1, k + 1), L(f, r + 1, k)])));

"use strict";
/* ------------------------------------------------------------------
   The model library. Each model is a short recipe (see engine.js for the
   recipe language). Family helpers below write the repetitive parts so a
   new animal, flower or car is one line.
------------------------------------------------------------------ */
const LIB = [];
function M(name, cat, sub, ops, o = {}) { LIB.push({ name, cat, sub, ops, ...o }); }

/* ---------- family helpers ---------- */

// Upright, front-facing critter: body layers, optional head layer, ears on top.
function critter(o) {
  const w = o.w || 1, ops = [`R 0 0 ${w} 1`];
  o.body.forEach((c, i) => ops.push(`W ${c}${o.belly ? " front=" + o.belly : ""} | ${i ? "More body" : "Body"}`));
  if (o.paws) ops.push(`E rect ${o.paws} on=front at=base tilt=90 r=paws`);
  if (o.tail) ops.push(`E ${o.tail[0]} ${o.tail[1]} on=back cells=${w > 1 ? "last" : "mid"} at=base tilt=${o.tail[2] ?? 40} r=tail`);
  if (o.wings) ops.push(`E ${o.wings[0]} ${o.wings[1]} on=left,right tilt=${o.wings[2] ?? 160} r=wings`);
  if (o.beak) ops.push(`E tri ${o.beak} on=front cells=mid tilt=100 r=beak`);
  if (o.head) ops.push(`W ${o.head}${o.face ? " front=" + o.face : ""} | Head`);
  ops.push(`T ${o.lid || o.head || o.body[o.body.length - 1].split(",")[0]}`);
  if (o.ears) ops.push(`E ${o.ears[0]} ${o.ears[1]} on=${o.ears[3] || (w > 1 ? "front" : "left,right")} cells=ends tilt=${o.ears[2] ?? 0} r=ears`);
  return ops.concat(o.extra || []);
}

// Side-on animal: long body along x, head on top of the left (front) end.
function beast(o) {
  const L = o.L || 2, n = o.body.length, ops = [`R 0 0 ${L} 1`];
  o.body.forEach((c, i) => ops.push(`W ${c} | ${i ? "More body" : "Body"}`));
  if (o.legs) ops.push(`E rect ${o.legs} on=front,back cells=ends at=base tilt=90 r=feet`);
  if (o.tail) ops.push(`E ${o.tail[0]} ${o.tail[1]} on=right tilt=${o.tail[2] ?? 50} r=tail`);
  ops.push(`T ${o.lid || o.body[n - 1].split(",")[0]}`);
  if (o.wings) ops.push(`E ${o.wings[0]} ${o.wings[1]} on=front,back cells=${o.wings[3] || "last"} tilt=${o.wings[2] ?? 60} r=wings`);
  if (o.spikes) ops.push(`E tri ${o.spikes} on=front cells=all tilt=0 r=spikes`);
  let z = n;
  ops.push(`R 0 0 1 1 ${z}`);
  (o.neck || []).forEach((c) => { ops.push(`W ${c} | Neck`); z++; });
  if (o.neck) ops.push(`R 0 0 1 1 ${z}`);
  if (o.snout) ops.push(`E ${o.snout[0]} ${o.snout[1]} on=left at=base tilt=${o.snout[2] ?? 70} r=${o.snout[3] || "snout"}`);
  ops.push(`W ${o.head}${o.face ? " left=" + o.face : ""} | Head`);
  ops.push(`T ${o.headTop || o.head}`);
  if (o.ears) ops.push(`E ${o.ears[0]} ${o.ears[1]} on=front,back tilt=${o.ears[2] ?? 0} r=${o.ears[3] || "ears"}`);
  return ops.concat(o.extra || []);
}

// Fish: a chunky 2x1 body two layers tall with a V tail at the back.
function fish(c, fin, o = {}) {
  return [
    `R 0 0 ${o.L || 2} 1`, `W ${c}${o.belly ? " front=" + o.belly : ""} | Body`, `W ${c} | Top of body`, `T ${c}`,
    `E tri ${fin} on=right at=2 tilt=40 r=tail`, `+E tri ${fin} on=right at=1 tilt=140`,
    `E ${o.dorsal || "tri"} ${fin} on=front cells=mid tilt=0 at=2 | Top fin | Stand a ${COLORS[fin].name.toLowerCase()} ${o.dorsal === "rtri" ? "right triangle" : o.dorsal === "tall" ? "tall triangle" : "triangle"} on the top edge for the fin.`,
    ...(o.extra || []),
  ];
}

// Potted flower: pot, stem, then a flower head.
function flower(o) {
  const ops = ["R 0 0 1 1", `F ${o.pot}`, `+W ${o.pot} | Flower pot | Lay a ${COLORS[o.pot].name.toLowerCase()} square flat and stand 4 more around it to make the pot.`];
  for (let i = 0; i < (o.stem ?? 2); i++) ops.push(`W green | ${i ? "Taller stem" : "Stem"}`);
  if (o.leaves !== false) ops.push(`E tall green on=left,right at=1 tilt=${o.leafTilt ?? 40} r=leaves`);
  ops.push(...o.head);
  return ops;
}

// Simple cars and trucks, length L, along x with the front at the left.
function car(o) {
  const L = o.L || 3, ops = [`R 0 0 ${L} 1`, `WH ${o.chassis || "blue"} cells=0,${L - 1}`, `W ${o.body} h=.5 left=${o.lights || "yellow"} | Body`];
  const hood = (x) => `R ${x} 0 1 1`;
  ops.push(hood(0), `T ${o.body} | Hood and trunk`, hood(L - 1), `+T ${o.body}`);
  ops.push(`R 1 0 ${L - 2} 1`, `W ${o.glass || "clear"} | Cabin | Stand clear squares in a ring over the open middle. These are the windows.`, `T ${o.roof || o.body} | Roof`);
  return ops.concat(o.extra || []);
}

/* perimeter ring of a w×d footprint, 1 tile tall, at height z.
   colors: a single color, or {all, front, back, left, right, f:[per-front-cell]} */
function perim(x, y, w, d, z, colors) {
  const c = typeof colors === "string" ? { all: colors } : colors;
  const pick = (side, i) => (side === "front" && c.f ? c.f[i] : null) || c[side] || c.all;
  const t = [];
  for (let i = 0; i < w; i++) t.push(wx(x + i, y, z, pick("front", i)));
  for (let i = 0; i < d; i++) t.push(wy(x + w, y + i, z, pick("right", i)));
  for (let i = 0; i < w; i++) t.push(wx(x + i, y + d, z, pick("back", i)));
  for (let i = 0; i < d; i++) t.push(wy(x, y + i, z, pick("left", i)));
  return t;
}
const lid = (x, y, w, d, z, c) => range(0, w).flatMap((i) => range(0, d).map((j) => flat(x + i, y + j, z, c)));
const front = (x, z, c) => wx(x, 0, z, c);              // single front-face tile at y=0
const upTri = (x, z, c, y = 0) => eqOn([x, y, z], [x + 1, y, z], [0, 0, 1], c);   // standing triangle on a top edge
const sideTri = (side, x, y, z, c, out) => eqOn([x, y, z], side === "x" ? [x + 1, y, z] : [x, y + 1, z], out, c);

function filtered() {
  const words = cat.q.toLowerCase().split(/\s+/).filter(Boolean);
  let list = MODELS.filter((m) => {
    if (cat.c !== "All" && m.cat !== cat.c) return false;
    if (cat.level !== "any" && m.level !== Number(cat.level)) return false;
    if (!words.length) return true;
    const hay = `${m.name} ${m.cat} ${m.sub} ${m.tags}`.toLowerCase();
    return words.every((w) => hay.includes(w));
  });
  const n = (m) => allTiles(m).length;
  if (cat.sort === "az") list = list.slice().sort((a, b) => a.name.localeCompare(b.name));
  else if (cat.sort === "fewest") list = list.slice().sort((a, b) => n(a) - n(b));

  $topright.innerHTML = "";
  const counts = { All: MODELS.length };
  for (const m of MODELS) counts[m.cat] = (counts[m.cat] || 0) + 1;
  $view.innerHTML = `<div class="wrap">
    <section class="hero">
      <h1>Magnetic tile builds, one step at a time</h1>
      <p>${MODELS.length} models to build, from Singapore landmarks to pandas, rockets and cupcakes. Pick one, gather the tiles on its parts list, then follow the numbered steps.</p>
    </section>
    <div class="searchrow">
      <label class="search" for="q">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Search: panda, rocket, Singapore…" value="${esc(cat.q)}" autocomplete="off">
      </label>
      <button class="btn ghost small" id="surprise">Surprise me</button>
    </div>
    <div class="chips" role="group" aria-label="Category">
      ${["All", ...CATEGORY_ORDER].map((c) => `<button class="chip" data-cat="${c}" aria-pressed="${c === cat.c}">${c} <span class="count">${counts[c] || 0}</span></button>`).join("")}
    </div>
    <div class="filterbar">
      <span id="resultcount" class="resultcount"></span>
      <span class="spacer"></span>
      <label class="sel">Difficulty
        <select id="level"><option value="any">Any</option><option value="1">Easy</option><option value="2">Medium</option><option value="3">Tricky</option></select>
      </label>
      <label class="sel">Sort
        <select id="sort"><option value="featured">Featured</option><option value="az">A to Z</option><option value="fewest">Fewest tiles</option><option value="most">Most tiles</option></select>
      </label>
    </div>
    <div class="grid" id="grid"></div>
    <div class="more"><button class="btn ghost" id="more">Show more</button></div>
  </div>`;
  const $grid = document.getElementById("grid"), $more = document.getElementById("more"), $count = document.getElementById("resultcount");
  document.getElementById("level").value = cat.level;
  document.getElementById("sort").value = cat.sort;
  const draw = () => {
    const list = filtered(), prog = loadProgress();
    $count.textContent = list.length === 1 ? "1 model" : `${list.length} models`;
    $grid.innerHTML = list.length ? list.slice(0, cat.limit).map((m) => cardHTML(m, prog)).join("")
      : `<div class="empty"><h3>Nothing matches “${esc(cat.q)}”</h3><p>Try a simpler word like dog, car or tower, or pick All.</p></div>`;
    $more.hidden = list.length <= cat.limit;
    $more.textContent = `Show more (${list.length - cat.limit} left)`;
    hydrateThumbs($grid);
    saveCat();
  };
  const reset = () => { cat.limit = PAGE; draw(); };
  document.getElementById("q").addEventListener("input", (e) => { cat.q = e.target.value; reset(); });
  document.getElementById("level").addEventListener("change", (e) => { cat.level = e.target.value; reset(); });
  document.getElementById("sort").addEventListener("change", (e) => { cat.sort = e.target.value; reset(); });
  $more.addEventListener("click", () => { cat.limit += PAGE; draw(); });
  document.getElementById("surprise").addEventListener("click", () => {
    const list = filtered().length ? filtered() : MODELS;
    location.hash = list[Math.floor(Math.random() * list.length)].id;
  });
  $view.querySelectorAll("[data-cat]").forEach((b) => b.addEventListener("click", () => {
    cat.c = b.dataset.cat;
    $view.querySelectorAll("[data-cat]").forEach((x) => x.setAttribute("aria-pressed", x === b));
    reset();
  }));
  draw();
}

function relatedHTML(m) {
  const same = MODELS.filter((x) => x !== m && x.sub === m.sub);
  const more = MODELS.filter((x) => x !== m && x.cat === m.cat && x.sub !== m.sub);
  const pick = [...same, ...more].slice(0, 4);
  if (!pick.length) return "";
  const prog = loadProgress();
  return `<section class="related"><h2 class="section-title">More ${esc(m.cat.toLowerCase())} to build</h2><div class="grid">${pick.map((x) => cardHTML(x, prog)).join("")}</div></section>`;
}

function backBtn(href, label) {
  return `<a class="iconbtn" href="${href}" aria-label="${label}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg><span>${label}</span></a>`;
}

function renderOverview(m) {
  document.title = m.name + " · Tile Builder";
  $crumb.textContent = m.name;
  $topright.innerHTML = backBtn("#catalog", "All models");
  const parts = countParts(allTiles(m)), total = allTiles(m).length, p = loadProgress()[m.id];
  $view.innerHTML = `<div class="wrap overview">
    <div class="viewer" id="viewer"></div>
    <div class="info">
      <span class="tag">${esc(m.cat)} · ${esc(m.sub)}</span>
      <h1>${esc(m.name)}</h1>
      <p class="lede">${esc(m.blurb)}</p>
      <div class="stats">
        <div class="stat"><b>${total}</b><span>Tiles</span></div>
        <div class="stat"><b>${m.steps.length}</b><span>Steps</span></div>
        <div class="stat"><b>${levelName(m.level)}</b><span>${difficulty(m.level)}</span></div>
      </div>
      <div class="actions">
        ${p != null ? `<a class="btn" href="#${m.id}-step-${p + 1}">Continue at step ${p + 1}</a><a class="btn ghost" href="#${m.id}-step-1">Start over</a>` : `<a class="btn" href="#${m.id}-step-1">Start building</a>`}
      </div>
      <h2 class="section-title">Parts list</h2>
      <div class="bom">
        ${parts.map((pt) => `<div class="part">${partIcon(pt.k, pt.c)}<div><div class="n">${pt.n}×</div><div class="l">${esc(partLabel(pt))}</div></div></div>`).join("")}
      </div>
    </div></div>
    <div class="wrap">${relatedHTML(m)}</div>`;
  mountViewer(document.getElementById("viewer"), m, m.steps.length - 1);
  hydrateThumbs($view);
}

function renderStep(m, i, fromPrev) {
  const step = m.steps[i], N = m.steps.length;
  document.title = `${m.name}, step ${i + 1} · Tile Builder`;
  $crumb.textContent = m.name;
  $topright.innerHTML = backBtn(`#${m.id}`, "Parts");
  saveProgress(m.id, i);
  const parts = countParts(step.tiles);
  const placed = m.steps.slice(0, i + 1).reduce((s, st) => s + st.tiles.length, 0), total = allTiles(m).length;
  $view.innerHTML = `<div class="wrap steplayout">
    <div class="viewer" id="viewer"></div>
    <aside class="panel">
      <div class="stepnum"><b>${i + 1}</b><span>of ${N}</span></div>
      <h1 class="steptitle">${esc(step.title)}</h1>
      <div class="callout" aria-label="Tiles to add in this step">
        <span class="tag">Add these tiles</span>
        <div class="parts">
          ${parts.map((pt) => `<div class="p">${partIcon(pt.k, pt.c)}<div><b>${pt.n}×</b><small>${esc(partLabel(pt))}</small></div></div>`).join("")}
        </div>
      </div>
      <p class="tip">${esc(step.tip)}</p>
      <label class="toggle"><input type="checkbox" id="hl" ${view.highlight ? "checked" : ""}> Fade earlier steps</label>
      <div>
        <div class="progress" aria-hidden="true"><i style="width:${(placed / total) * 100}%"></i></div>
        <div class="progress-label"><span>${placed} of ${total} tiles placed</span><span>${Math.round((placed / total) * 100)}%</span></div>
      </div>
      <span class="kbd">Tip: use the ← and → keys to change steps.</span>
      <nav class="stepnav" aria-label="Step navigation">
        <a class="btn ghost" ${i === 0 ? `href="#${m.id}" aria-label="Back to parts list"` : `href="#${m.id}-step-${i}"`}>Back</a>
        <a class="btn" href="${i === N - 1 ? `#${m.id}-done` : `#${m.id}-step-${i + 2}`}">${i === N - 1 ? "Finish" : "Next step"}</a>
      </nav>
    </aside></div>`;
  const vEl = document.getElementById("viewer");
  const mount = (animate) => mountViewer(vEl, m, i, { highlight: view.highlight, animate });
  mount(fromPrev);
  document.getElementById("hl").addEventListener("change", (e) => { view.highlight = e.target.checked; mount(false); });
}

function renderDone(m) {
  document.title = `${m.name} complete · Tile Builder`;
  $crumb.textContent = m.name;
  $topright.innerHTML = backBtn("#catalog", "All models");
  saveProgress(m.id, null);
  const total = allTiles(m).length;
  const pool = MODELS.filter((x) => x !== m && x.cat === m.cat), next = pool[Math.floor(Math.random() * pool.length)] || MODELS[0];
  $view.innerHTML = `<div class="wrap done">
    <div class="viewer" id="viewer"></div>
    <div class="info">
      <span class="tag">Build complete</span>
      <h1>You built the ${esc(m.name)}!</h1>
      <p class="lede">${total} tiles in ${m.steps.length} steps. Turn it around and admire it from every side, then try another model.</p>
      <div class="actions">
        <a class="btn" href="#${next.id}">Next: ${esc(next.name)}</a>
        <a class="btn ghost" href="#catalog">All models</a>
      </div>
    </div></div>`;
  mountViewer(document.getElementById("viewer"), m, m.steps.length - 1);
}

/* ------------------------------------------------------------------
   Router. Hash forms: #catalog, #<model>, #<model>-step-<n>, #<model>-done
------------------------------------------------------------------ */
let last = { id: null, step: -1 };
function route() {
  document.body.classList.toggle("inmodel", !!location.hash && location.hash !== "#catalog");
  const h = decodeURIComponent(location.hash.slice(1));
  let mm;
  if ((mm = h.match(/^(.+)-step-(\d+)$/)) && byId[mm[1]]) {
    const m = byId[mm[1]], i = Math.max(0, Math.min(m.steps.length - 1, Number(mm[2]) - 1));
    const fromPrev = last.id === m.id ? i > last.step : true;
    renderStep(m, i, fromPrev);
    last = { id: m.id, step: i };
  } else if ((mm = h.match(/^(.+)-done$/)) && byId[mm[1]]) {
    renderDone(byId[mm[1]]); last = { id: null, step: -1 };
  } else if (byId[h]) {
    renderOverview(byId[h]); last = { id: h, step: -1 };
  } else {
    renderCatalog(); last = { id: null, step: -1 };
  }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
document.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("input, textarea")) return;
  const mm = decodeURIComponent(location.hash.slice(1)).match(/^(.+)-step-(\d+)$/);
  if (!mm || !byId[mm[1]]) return;
  const m = byId[mm[1]], n = Number(mm[2]);
  if (e.key === "ArrowRight") location.hash = n >= m.steps.length ? `${m.id}-done` : `${m.id}-step-${n + 1}`;
  if (e.key === "ArrowLeft") location.hash = n <= 1 ? m.id : `${m.id}-step-${n - 1}`;
});
route();

</script>
