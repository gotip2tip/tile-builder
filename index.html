<meta charset="utf-8">
<title>Tile Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: instruction-booklet feel. Cool blue-grey paper, white stage, yellow "add these" callouts, chunky rounded display type. */
:root {
  --bg: #eaf0f5;
  --surface: #ffffff;
  --stage: #f8fafc;
  --stage-dot: #d8e1ea;
  --ink: #18212d;
  --muted: #5a6778;
  --line: #d3dce6;
  --accent: #f0592a;
  --accent-ink: #ffffff;
  --callout: #fff3c4;
  --callout-line: #f1cf55;
  --new-stroke: #18212d;
  --ground: #c9d5e1;
  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151c; --surface: #19202a; --stage: #141a22; --stage-dot: #232c38;
    --ink: #edf2f7; --muted: #9ba8b8; --line: #2a3442; --accent: #ff7247; --accent-ink: #1a0d07;
    --callout: #2b2614; --callout-line: #6b5a1c; --new-stroke: #ffffff; --ground: #263140;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151c; --surface: #19202a; --stage: #141a22; --stage-dot: #232c38;
  --ink: #edf2f7; --muted: #9ba8b8; --line: #2a3442; --accent: #ff7247; --accent-ink: #1a0d07;
  --callout: #2b2614; --callout-line: #6b5a1c; --new-stroke: #ffffff; --ground: #263140;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; }
button, a { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .2px; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand span { white-space: nowrap; }
.topbar .crumb { color: var(--muted); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .spacer { flex: 1; }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; min-width: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; font-weight: 700; }
.iconbtn:hover { border-color: var(--muted); }
.iconbtn svg { width: 18px; height: 18px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 0; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-weight: 600; font-size: 18px; text-decoration: none; }
.btn:hover { filter: brightness(1.05); }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
.btn[disabled] { opacity: .35; cursor: default; }

/* Catalog */
.hero { padding-block: 28px 8px; display: grid; gap: 10px; }
.hero h1 { font-size: clamp(30px, 5vw, 46px); font-weight: 700; }
.hero p { margin: 0; color: var(--muted); max-width: 60ch; font-size: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 16px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; padding-bottom: 28px; }
.card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; text-decoration: none; transition: transform .15s ease, box-shadow .15s ease; }
a.card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(20, 40, 70, .12); }
.card .thumb { aspect-ratio: 4 / 3; max-width: 100%; background: var(--stage); background-image: radial-gradient(var(--stage-dot) 1px, transparent 1.2px); background-size: 16px 16px; display: grid; place-items: center; }
.card .thumb svg { width: 100%; height: 100%; }
.card .body { padding: 12px 14px 14px; display: grid; gap: 6px; }
.card h3 { font-size: 20px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--muted); font-size: 13px; font-weight: 600; }
.tag { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.searchrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-top: 12px; }
.search { flex: 1 1 260px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 0 16px; min-height: 48px; }
.search:focus-within { border-color: var(--accent); }
.search svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; font-size: 16px; }
.btn.small { min-height: 48px; font-size: 16px; padding: 0 18px; }
.chip .count { font-weight: 600; opacity: .6; font-variant-numeric: tabular-nums; margin-left: 2px; }
.filterbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-bottom: 14px; }
.filterbar .spacer { flex: 1; }
.resultcount { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.sel { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
.sel select { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
.more { display: flex; justify-content: center; padding-bottom: 40px; }
.empty { grid-column: 1 / -1; text-align: center; padding: 40px 16px; color: var(--muted); }
.empty h3 { color: var(--ink); margin-bottom: 6px; }
.onstep { color: var(--accent); }
.related { padding-bottom: 40px; display: grid; gap: 14px; }
.related .grid { padding-bottom: 0; }
@media (max-width: 520px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .card h3 { font-size: 16px; } .card .body { padding: 10px; } .card .meta span:nth-child(2) { display: none; } }
.soon-row { display: grid; gap: 10px; padding-bottom: 40px; }
.soon-list { display: flex; flex-wrap: wrap; gap: 8px; }
.soon-item { border: 1px dashed var(--line); border-radius: 999px; padding: 6px 14px; color: var(--muted); font-weight: 700; font-size: 14px; }
.dots { letter-spacing: 2px; color: var(--accent); }
.dots i { font-style: normal; color: var(--line); }

/* Model overview */
.overview { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 24px; padding-block: 20px 40px; align-items: start; }
.overview .info { display: grid; gap: 16px; }
.overview h1 { font-size: clamp(30px, 4.4vw, 44px); font-weight: 700; }
.overview .lede { margin: 0; color: var(--muted); font-size: 16px; max-width: 60ch; }
.stats { display: flex; flex-wrap: wrap; gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; display: grid; }
.stat b { font-family: var(--font-display); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.section-title { font-family: var(--font-display); font-size: 20px; font-weight: 600; }
.bom { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.part { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.part svg { width: 40px; height: 40px; flex: none; }
.part .n { font-family: var(--font-display); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; }
.part .l { font-size: 13px; color: var(--muted); line-height: 1.25; font-weight: 600; }

/* Viewer */
.viewer { position: relative; background: var(--stage); background-image: radial-gradient(var(--stage-dot) 1px, transparent 1.2px); background-size: 18px 18px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.viewer .stage { width: 100%; height: 100%; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; }
.viewer .stage:active { cursor: grabbing; }
.viewer .stage svg { width: 100%; height: 100%; display: block; }
.viewer .tools { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
.viewer .tools .iconbtn { height: 36px; min-width: 36px; padding: 0 10px; font-size: 13px; }
.viewer .hint { position: absolute; left: 12px; bottom: 12px; font-size: 12px; color: var(--muted); font-weight: 600; pointer-events: none; }
.overview .viewer { aspect-ratio: 1 / 1; max-width: 100%; }

/* Polygons */
.tile { stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.tile.old { stroke-opacity: .55; }
.tile.nw { stroke: var(--new-stroke); stroke-width: 2.6; }
.rim { fill: none; stroke: #ffffff; stroke-opacity: .55; stroke-width: 1; vector-effect: non-scaling-stroke; }
.rim.old { stroke-opacity: .25; }
.groundpoly { fill: var(--ground); opacity: .55; }

/* Step page */
.steplayout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding-block: 16px 24px; }
.steplayout .viewer { height: calc(100vh - 56px - 32px - 60px); height: calc(100dvh - 56px - 32px - 60px); min-height: 380px; }
.panel { display: flex; flex-direction: column; gap: 14px; }
.stepnum { display: flex; align-items: baseline; gap: 10px; }
.stepnum b { font-family: var(--font-display); font-size: 64px; font-weight: 700; line-height: .9; font-variant-numeric: tabular-nums; }
.stepnum span { color: var(--muted); font-weight: 700; }
.stepnum-overlay { position: absolute; left: 14px; top: 8px; font-family: var(--font-display); font-weight: 700; font-size: 52px; line-height: 1; pointer-events: none; }
.callout { background: var(--callout); border: 2px solid var(--callout-line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 10px; }
.callout .tag { color: var(--ink); opacity: .7; }
.callout .parts { display: flex; flex-wrap: wrap; gap: 12px 18px; }
.callout .p { display: flex; align-items: center; gap: 6px; }
.callout .p svg { width: 44px; height: 44px; }
.callout .p b { font-family: var(--font-display); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.callout .p small { display: block; font-size: 12px; color: var(--muted); font-weight: 700; line-height: 1.2; }
.tip { margin: 0; font-size: 16px; }
.steptitle { font-size: 22px; }
.progress { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s ease; }
.progress-label { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stepnav { display: flex; gap: 10px; margin-top: auto; }
.stepnav .btn { flex: 1; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: var(--muted); }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
.kbd { font-size: 12px; color: var(--muted); }

/* Done */
.done { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; padding-block: 24px 40px; align-items: center; }
.done .viewer { aspect-ratio: 1 / 1; max-width: 100%; }
.done h1 { font-size: clamp(34px, 5vw, 54px); font-weight: 700; }
.done .info { display: grid; gap: 16px; }

@media (max-width: 860px) {
  .overview, .done { grid-template-columns: minmax(0, 1fr); }
  .steplayout { grid-template-columns: minmax(0, 1fr); padding-bottom: 96px; }
  .steplayout .viewer { height: auto; aspect-ratio: 1 / 1; max-height: 56vh; min-height: 0; width: 100%; }
  .stepnum b { font-size: 48px; }
  .stepnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; margin: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .kbd { display: none; }
}
@media (max-width: 520px) {
  body.inmodel .brand span { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#catalog" aria-label="Tile Builder home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 26 L16 4 L28 26 Z" fill="#f5c518" fill-opacity=".85" stroke="#b78e00" stroke-width="2" stroke-linejoin="round"/><rect x="11" y="15" width="14" height="14" rx="1.5" fill="#2f7de1" fill-opacity=".8" stroke="#1d4f90" stroke-width="2"/></svg>
      <span>Tile Builder</span>
    </a>
    <span class="crumb" id="crumb"></span>
    <span class="spacer"></span>
    <span id="topright"></span>
  </div>
</header>
<main id="view"></main>
